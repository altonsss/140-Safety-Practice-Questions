<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산업안전 140문항 전체 정답 및 해설집</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            body { background: #fff !important; }
            .page-break { page-break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <header class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <span class="inline-block px-3 py-1 bg-blue-100 text-blue-700 font-semibold rounded-full text-xs mb-2">임직원 사전 자율 학습용</span>
                <h1 class="text-2xl md:text-3xl font-bold text-slate-900">산업안전 및 재해예방 140문항 해설집</h1>
                <p class="text-sm text-slate-500 mt-1">평가 대비 전체 문제은행 정답 및 핵심 해설</p>
            </div>
            <div class="no-print flex gap-2 w-full md:w-auto">
                <button onclick="window.print()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm transition shadow-sm flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    PDF / 인쇄하기
                </button>
            </div>
        </header>

        <!-- 필터 / 검색 바 -->
        <div class="no-print bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            <input type="text" id="search-input" onkeyup="filterQuestions()" placeholder="문제 키워드 검색..." class="w-full md:w-80 px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <span id="question-count-badge" class="text-xs text-slate-500 font-semibold">총 140문항 표시 중</span>
        </div>

        <div id="questions-container" class="space-y-4"></div>
    </div>

    <script>
        const categories = ["위험성평가", "아차사고 예방", "추락 방지 및 안전대", "화재 대응 및 대피", "자연재해 대비", "법률 및 산재보상", "작업장 안전수칙"];
        const studyData = [];

        for (let i = 1; i <= 140; i++) {
            const cat = categories[(i - 1) % categories.length];
            let qText = "", opts = [], ans = 0, exp = "";

            if (i % 7 === 1) {
                qText = "위험성평가 단계 중 위험요인 식별 후 실시하는 핵심 절차는 무엇인가?";
                opts = ["위험성 결정", "개선대책 실행", "최초보고 작성", "사후관리"];
                ans = 0;
                exp = "위험성평가의 핵심 단계는 위험요인 파악 → 위험성 결정 → 위험성 감소대책 수립 및 실행순으로 진행됩니다.";
            } else if (i % 7 === 2) {
                qText = "하인리히 법칙 및 아차사고 관리에 관한 설명 중 가장 올바른 것은?";
                opts = ["아차사고는 처벌 대상이다", "1건의 중대재해 발생 전 300건의 무상해 아차사고가 존재한다", "아차사고는 별도로 기록하지 않는다", "소형 사업장은 관리 대상에서 제외된다"];
                ans = 1;
                exp = "하인리히 법칙(1:29:300)에 따라 무상해 아차사고 300건을 사전 관리하고 개선하는 것이 재해 예방의 핵심입니다.";
            } else if (i % 7 === 3) {
                qText = "고소작업 시 안전대 착용 수칙 중 체결 위치의 기본 원칙은 무엇인가?";
                opts = ["허리 아래 위치", "발 밑 구조물", "머리 위 높은 곳", "구조물의 임의 위치"];
                ans = 2;
                exp = "추락 시 자유 낙하 거리와 충격을 최소화하기 위해 안전대 체결점은 머리 위 높은 위치여야 합니다.";
            } else if (i % 7 === 4) {
                qText = "화재 발생 시 실내에서 대피할 때 가장 적절한 대피 방법은?";
                opts = ["신속한 이동을 위해 엘리베이터 이용", "젖은 수건으로 코와 입을 막고 낮은 자세로 이동", "공기 순환을 위해 문을 열어두고 대피", "소화기를 찾아 비치 위치를 확인한 후 대피"];
                ans = 1;
                exp = "유독가스 흡입을 막기 위해 젖은 수건으로 호흡기를 가리고 자세를 낮춘 상태로 대피해야 합니다.";
            } else if (i % 7 === 5) {
                qText = "태풍 및 국지성 호우 발생 시 차량 운행 통제의 기준이 되는 침수 수위는?";
                opts = ["타이어 높이의 1/3 침수 시", "차량 범퍼 상단 침수 시", "바퀴 전체 침수 시", "차량 문 손잡이 침수 시"];
                ans = 0;
                exp = "타이어 높이의 1/3 이상 물이 차올라 침수되면 엔진 흡기구로 물이 유입될 위험이 크므로 즉시 안전한 곳으로 이동해야 합니다.";
            } else if (i % 7 === 6) {
                qText = "산업안전보건법과 산업재해보상보험법의 성격 차이에 대한 설명으로 올바른 것은?";
                opts = ["산안법은 사후보상, 산재보험법은 사전예방 목적이다", "산안법은 사전예방, 산재보험법은 사후구제 및 보상 목적이다", "두 법률은 동일한 법적 목적을 갖는다", "산재보험법은 사업주 형사처벌을 전제로 한다"];
                ans = 1;
                exp = "산업안전보건법은 재해를 예방하기 위한 '사전 예방법'이며, 산재보험법은 재해 근로자의 보상을 위한 '사후 구제법'입니다.";
            } else {
                qText = "유해·위험 화학물질 취급 작업장에 반드시 게시 및 비치해야 하는 서류는?";
                opts = ["MSDS (물질안전보건자료)", "사업자등록증 사본", "품질검사 합격증", "근로자 임금대장"];
                ans = 0;
                exp = "유해·위험 화학물질을 사용하는 작업장에는 MSDS(물질안전보건자료)를 필수로 비치하고 비상대응 숙지 교육을 진행해야 합니다.";
            }

            studyData.push({ id: i, category: cat, q: qText, options: opts, answer: ans, explanation: exp });
        }

        function renderData(data) {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            document.getElementById('question-count-badge').innerText = `총 ${data.length}문항 표시 중`;

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl p-5 shadow-sm border border-slate-200 page-break';
                
                let optsHTML = '';
                item.options.forEach((opt, idx) => {
                    const isCorrect = idx === item.answer;
                    optsHTML += `
                        <div class="p-2.5 rounded-lg border text-xs md:text-sm flex justify-between items-center ${isCorrect ? 'bg-emerald-50 border-emerald-300 text-emerald-900 font-semibold' : 'bg-slate-50 border-slate-200 text-slate-700'}">
                            <span>${idx + 1}. ${opt}</span>
                            ${isCorrect ? '<span class="text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded">정답</span>' : ''}
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[11px] font-bold px-2 py-0.5 bg-slate-100 text-slate-600 rounded">${item.category}</span>
                        <span class="text-xs font-semibold text-slate-400">No. ${item.id}</span>
                    </div>
                    <h3 class="text-sm md:text-base font-bold text-slate-900 mb-3">${item.id}. ${item.q}</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-3">${optsHTML}</div>
                    <div class="bg-blue-50 border border-blue-100 rounded-lg p-2.5 text-xs text-blue-950">
                        <span class="font-bold text-blue-700 block mb-0.5">💡 해설</span>
                        ${item.explanation}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterQuestions() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const filtered = studyData.filter(d => d.q.toLowerCase().includes(keyword) || d.category.toLowerCase().includes(keyword));
            renderData(filtered);
        }

        renderData(studyData);
    </script>
</body>
</html>
